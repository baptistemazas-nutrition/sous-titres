<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sous-titres traduits</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:#1b1b1f;font-size:15px}
select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #444;background:#2a2a30;color:#fff;cursor:pointer}
.go{background:#e8643a;border-color:#e8643a;font-weight:700}
.st{color:#aaa}
.out{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 28px 28px;overflow:hidden}
.prev{font-size:calc(var(--s)*.6);opacity:.5;line-height:1.25;margin-bottom:12px}
.tr{font-size:var(--s);font-weight:700;line-height:1.2}
.orig{font-size:calc(var(--s)*.38);color:#9a9aa2;margin-top:14px;min-height:1.2em}
.hide .bar{display:none}
.hide #who2{display:block}
#who2{display:none;position:fixed;top:10px;right:16px;font-size:20px;opacity:.6}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin-right:6px}
.on .dot{background:#3ddc84}
</style></head><body style="--s:56px">
<div class="bar">
<select id="dir"><option value="fr-FR|en">Je parle français → sous-titres anglais</option><option value="en-US|fr">Je parle anglais → sous-titres français</option></select>
<button class="go" id="go">▶ Démarrer</button>
<button id="minus">A−</button><button id="plus">A+</button>
<button id="hide">Masquer les réglages</button>
<span id="who" style="font-size:22px">🇫🇷 → 🇬🇧</span><span class="st">Barre espace = changer de sens</span><span class="st" id="st"><span class="dot"></span>Arrêté</span>
</div>
<div id="who2"></div><div class="out"><div class="prev" id="prev"></div><div class="tr" id="tr">Clique sur ▶ Démarrer puis autorise le micro.</div><div class="orig" id="orig"></div></div>
<script>
const $=i=>document.getElementById(i);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false,size=56,last=0,pending=null;
const fix=t=>t.replace(/lipoprot\w*\s*(petit|little|small)\s*a\b|\bLP ?\(a\)|\bLPA\b/gi,"Lp(a)").replace(/\bobese (patients|people|subjects)\b/gi,"patients with obesity").replace(/\bnon-obese\b/gi,"without obesity");
function L(){const [s,t]=$("dir").value.split("|");return {s,t,sl:s.slice(0,2)}}
async function tr(text){const {sl,t}=L();
 try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+sl+"&tl="+t+"&q="+encodeURIComponent(text)).then(r=>r.json());return fix(r[0].map(x=>x[0]).join(""))}
 catch(e){try{if(window.Translator){const x=await Translator.create({sourceLanguage:sl,targetLanguage:t});return fix(await x.translate(text))}}catch(e){}return "⚠️ Pas de connexion internet : traduction impossible"}}
async function showFinal(text){const out=await tr(text);const cur=$("tr").dataset.final;if(cur)$("prev").textContent=cur;$("tr").textContent=out;$("tr").dataset.final=out;$("orig").textContent=""}
async function showInterim(text){const now=Date.now();if(now-last<700){clearTimeout(pending);pending=setTimeout(()=>showInterim(text),700);return}last=now;$("orig").textContent=text;$("tr").textContent=await tr(text)}
function start(){
 if(!SR){$("st").textContent="Ce navigateur ne reconnaît pas la voix : ouvre ce fichier avec Google Chrome.";return}
 rec=new SR();rec.lang=L().s;rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)showFinal(r[0].transcript.trim());else interim+=r[0].transcript}if(interim)showInterim(interim)};
 rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){on=false;$("st").textContent="Micro refusé : clique sur le cadenas à gauche de l'adresse → Micro → Autoriser";}};
 rec.onend=()=>{if(on)setTimeout(()=>{try{rec.lang=L().s;rec.start()}catch(e){}},200)};
 on=true;rec.start();document.body.classList.add("on");$("go").textContent="■ Arrêter";$("st").innerHTML='<span class="dot"></span>Micro actif';$("tr").textContent="J'écoute…";
}
function stop(){on=false;rec&&rec.stop();document.body.classList.remove("on");$("go").textContent="▶ Démarrer";$("st").innerHTML='<span class="dot"></span>Arrêté'}
$("go").onclick=()=>on?stop():start();
$("plus").onclick=()=>{size+=8;document.body.style.setProperty("--s",size+"px")};
$("minus").onclick=()=>{size=Math.max(24,size-8);document.body.style.setProperty("--s",size+"px")};
$("hide").onclick=()=>document.body.classList.add("hide");
addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.remove("hide");if(e.code==="Space"&&e.target.tagName!=="SELECT"){e.preventDefault();const d=$("dir");d.selectedIndex=1-d.selectedIndex;flag();if(on)rec.stop()}});
function flag(){$("who2").textContent=$("who").textContent=$("dir").selectedIndex?"🇬🇧 → 🇫🇷":"🇫🇷 → 🇬🇧"}
$("dir").onchange=()=>{flag();if(on){rec.stop()}};
</script></body></html>
