<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sous-titres traduits</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:#1b1b1f;font-size:15px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #444;background:#2a2a30;color:#fff;cursor:pointer}
.go{background:#e8643a;border-color:#e8643a;font-weight:700}
.dir{font-size:20px;font-weight:700;background:#1e3a8a;border-color:#3b5bdb}
.st{color:#aaa}
#log{flex:1;overflow-y:auto;padding:16px 26px 24px;display:flex;flex-direction:column;gap:14px}
.line{border-left:5px solid #3b5bdb;padding-left:14px}
.line.en{border-color:#e8643a}
.t{font-size:var(--s);font-weight:700;line-height:1.2}
.o{font-size:calc(var(--s)*.42);color:#9a9aa2;margin-top:4px}
.live .t{opacity:.85}
.hide .bar{display:none}
#who2{display:none;position:fixed;top:8px;right:14px;font-size:20px;opacity:.6}
.hide #who2{display:block}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin-right:6px}
.on .dot{background:#3ddc84}
</style></head><body style="--s:44px">
<div class="bar">
<button class="dir" id="dir">🇫🇷 Je parle → 🇬🇧</button>
<button class="go" id="go">▶ Démarrer</button>
<button id="minus">A−</button><button id="plus">A+</button>
<button id="clear">Effacer</button>
<button id="hide">Masquer les réglages</button>
<span class="st">Espace = changer de langue · Échap = réglages</span>
<span class="st" id="st"><span class="dot"></span>Arrêté</span>
</div>
<div id="who2"></div>
<div id="log"></div>
<script>
const $=i=>document.getElementById(i);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false,size=44,fr=true,live=null,seq=0,timer=null,lastQ="";
const fix=t=>t.replace(/lipoprot\w*\s*(petit|little|small)\s*a\b|\bLP ?\(a\)|\bLPA\b/gi,"Lp(a)").replace(/\bobese (patients|people|subjects)\b/gi,"patients with obesity").replace(/\bnon-obese\b/gi,"without obesity");
const cfg=()=>fr?{lang:"fr-FR",sl:"fr",tl:"en",cls:"fr"}:{lang:"en-US",sl:"en",tl:"fr",cls:"en"};
async function tr(text,c){try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+c.sl+"&tl="+c.tl+"&q="+encodeURIComponent(text)).then(r=>r.json());return fix(r[0].map(x=>x[0]).join(""))}catch(e){return "⚠️ Pas de connexion internet"}}
function newLine(c){const d=document.createElement("div");d.className="line live "+c.cls;d.innerHTML='<div class="t"></div><div class="o"></div>';$("log").appendChild(d);while($("log").children.length>30)$("log").firstChild.remove();return d}
function scroll(){$("log").scrollTop=$("log").scrollHeight}
function update(text,final){
 const c=cfg();if(!live)live=newLine(c);
 const el=live;el.querySelector(".o").textContent=text;scroll();
 const id=++seq;
 const go=async()=>{const out=await tr(text,c);if(final||id===seq){el.querySelector(".t").textContent=out;scroll()}};
 if(final){clearTimeout(timer);go();el.classList.remove("live");live=null;lastQ=""}
 else if(text!==lastQ){lastQ=text;clearTimeout(timer);timer=setTimeout(go,150)}
}
function start(){
 if(!SR){$("st").textContent="Ouvre cette page avec Google Chrome.";return}
 rec=new SR();rec.lang=cfg().lang;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
 rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)update(r[0].transcript.trim(),true);else interim+=r[0].transcript}if(interim.trim())update(interim.trim(),false)};
 rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){on=false;$("st").textContent="Micro refusé : icône à gauche de l'adresse → Micro → Autoriser"}else if(e.error==="audio-capture"){$("st").textContent="Aucun micro : choisis « Micro MacBook Pro » dans les réglages du site"}};
 rec.onend=()=>{if(live){live.classList.remove("live");live=null}if(on)setTimeout(()=>{try{rec.lang=cfg().lang;rec.start()}catch(e){}},100)};
 on=true;rec.start();document.body.classList.add("on");$("go").textContent="■ Arrêter";$("st").innerHTML='<span class="dot"></span>Micro actif';
}
function stop(){on=false;rec&&rec.stop();document.body.classList.remove("on");$("go").textContent="▶ Démarrer";$("st").innerHTML='<span class="dot"></span>Arrêté'}
function flip(){fr=!fr;const t=fr?"🇫🇷 Je parle → 🇬🇧":"🇬🇧 Il parle → 🇫🇷";$("dir").textContent=t;$("who2").textContent=t;if(live){live.classList.remove("live");live=null}if(on)rec.abort()}
$("go").onclick=()=>on?stop():start();
$("dir").onclick=flip;
$("plus").onclick=()=>{size+=6;document.body.style.setProperty("--s",size+"px")};
$("minus").onclick=()=>{size=Math.max(20,size-6);document.body.style.setProperty("--s",size+"px")};
$("clear").onclick=()=>{$("log").innerHTML="";live=null};
$("hide").onclick=()=>document.body.classList.add("hide");
addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.remove("hide");if(e.code==="Space"){e.preventDefault();flip()}});
$("who2").textContent=$("dir").textContent;
</script></body></html>
